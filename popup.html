<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Preview Image Saver</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        body { width: 340px; }
        header { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
        header img { width: 36px; height: 36px; }
        h1 { margin: 0; font-size: 15px; line-height: 1.3; }
        header p { margin: 0; font-size: 12px; color: var(--text-muted); }
        main { padding: 16px 18px 18px; }
        .actions button { flex: 1; padding: 9px 10px; white-space: nowrap; }
        .hint { margin: 14px 0 0; font-size: 12px; color: var(--text-muted); }
        .hint code { font-size: 12px; }
        .setting { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-top: 18px; padding-top: 16px;
                   border-top: 1px solid var(--border); cursor: pointer; }
        .setting strong { display: block; font-size: 14px; }
        .setting small { display: block; margin-top: 2px; font-size: 12px; line-height: 1.5; color: var(--text-muted); }
        .switch { appearance: none; flex: none; position: relative; width: 38px; height: 22px; margin: 2px 0 0; border-radius: 999px;
                  background: var(--idle-bg); cursor: pointer; transition: background-color .18s; }
        .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
                         background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .18s; }
        .switch:checked { background: var(--primary); }
        .switch:checked::after { transform: translateX(16px); }
        .switch:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    </style>
</head>
<body>
    <header>
        <img src="icons/icon-48.png" alt="">
        <div>
            <h1>Preview Image Saver</h1>
            <p>一鍵下載封面與預覽圖</p>
        </div>
    </header>
    <main>
        <div class="folder">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z"/></svg>
            <span id="folder">尚未選擇</span>
        </div>
        <div class="row">
            <span class="label">授權狀態</span>
            <span id="permission" class="badge" data-state="none" role="status">-</span>
        </div>
        <div class="actions">
            <button type="button" class="primary" data-action="pick">選擇資料夾</button>
            <button type="button" data-action="reauth">重新授權</button>
        </div>
        <p id="message" role="alert"></p>
        <label class="setting">
            <span>
                <strong>下載前先選擇圖片</strong>
                <small>關閉時按一下就下載全部；開啟後會先跳出縮圖視窗，讓你勾選要下載的圖片。</small>
            </span>
            <input type="checkbox" class="switch" id="pickMode" role="switch">
        </label>
        <label class="setting">
            <span>
                <strong>滑鼠停留自動放大</strong>
                <small>選圖視窗中，滑鼠停在縮圖上 0.5 秒會放大顯示原圖；關閉則不放大。</small>
            </span>
            <input type="checkbox" class="switch" id="hoverZoom" role="switch">
        </label>
        <p class="hint">授權提示若有「每次造訪時允許」，請選它，就不用天天重新授權。</p>
        <p class="hint">圖片存到 <code class="chip">根資料夾/YYYYMMDD/演員 番號/</code><br>網頁上的按鈕可以拖曳，位置會被記住。</p>
        <p class="hint"><a href="welcome.html" target="_blank">查看教學</a></p>
    </main>
    <script src="store.js"></script>
    <script src="folder-ui.js"></script>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
</body>
</html>
